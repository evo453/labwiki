<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>实验室知识库 · 申请访问</title>
<style>
  :root {
    --bg: #f5f7fb;
    --card-bg: #ffffff;
    --text: #2c3e50;
    --sub: #6b7b8d;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --success: #10b981;
    --border: #e5e7eb;
    --shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 16px rgba(0,0,0,.04);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: var(--card-bg);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 48px 40px;
    max-width: 480px;
    width: 100%;
    text-align: center;
    transition: all .3s;
  }
  .icon {
    width: 64px;
    height: 64px;
    margin: 0 auto 24px;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    color: #fff;
  }
  h1 { font-size: 22px; color: var(--text); margin-bottom: 8px; font-weight: 600; }
  .desc { color: var(--sub); font-size: 14px; line-height: 1.6; margin-bottom: 32px; }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 14px 36px;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    transition: all .2s;
    text-decoration: none;
  }
  .btn:hover { background: var(--accent-hover); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(59,130,246,.3); }
  .btn:disabled { background: #93c5fd; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn.success { background: var(--success); }
  .btn.success:hover { background: #059669; }

  /* 状态区域 */
  .status-area { display: none; margin-top: 28px; padding: 20px; background: #f8fafc; border-radius: 10px; border: 1px solid var(--border); }
  .status-area.visible { display: block; }
  .spinner {
    display: inline-block;
    width: 24px;
    height: 24px;
    border: 3px solid #e5e7eb;
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .8s linear infinite;
    margin-bottom: 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status-msg { color: var(--sub); font-size: 14px; margin-top: 8px; }

  .link-box {
    display: none;
    margin-top: 16px;
    padding: 16px;
    background: #ecfdf5;
    border: 1px solid #a7f3d0;
    border-radius: 10px;
    word-break: break-all;
    font-size: 13px;
    color: #065f46;
  }
  .link-box.visible { display: block; }

  .error-box {
    display: none;
    margin-top: 16px;
    padding: 14px;
    background: #fef2f2;
    border: 1px solid #fecaca;
    border-radius: 10px;
    font-size: 13px;
    color: #991b1b;
  }
  .error-box.visible { display: block; }

  .info-row {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin-top: 32px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    color: var(--sub);
    font-size: 12px;
  }
  .info-row span { display: flex; align-items: center; gap: 4px; }
</style>
</head>
<body>

<div class="card">
  <div class="icon">📚</div>
  <h1>实验室知识库</h1>
  <p class="desc">按需启动 · 自动回收 · 零闲置成本</p>

  <button id="applyBtn" class="btn" onclick="apply()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
    申请访问
  </button>

  <div id="statusArea" class="status-area">
    <div id="spinnerEl" class="spinner"></div>
    <p id="statusMsg" class="status-msg"></p>
    <div id="linkBox" class="link-box">
      <a id="gotoLink" href="#" target="_blank" class="btn success" style="display:block;text-align:center;">
        点击进入知识库 →
      </a>
    </div>
    <div id="errorBox" class="error-box"></div>
  </div>

  <div class="info-row">
    <span>⏱ 首次约 1-2 分钟</span>
    <span>🔄 5 分钟闲置自动回收</span>
  </div>
</div>

<script>
// ========== 配置 ==========
// 部署后把下面这行改成你的 Cloudflare Worker 地址
const SCHEDULER_URL = 'https://eclipsing-star-ff29.192529443.workers.dev';

// ========== 逻辑 ==========
let pollTimer = null;

async function apply() {
  const btn = document.getElementById('applyBtn');
  const area = document.getElementById('statusArea');
  const msg = document.getElementById('statusMsg');
  const spinner = document.getElementById('spinnerEl');
  const linkBox = document.getElementById('linkBox');
  const gotoLink = document.getElementById('gotoLink');
  const errBox = document.getElementById('errorBox');

  btn.disabled = true;
  btn.textContent = '正在申请...';
  area.classList.add('visible');
  spinner.style.display = 'inline-block';
  msg.textContent = '正在向调度器发送申请...';
  linkBox.classList.remove('visible');
  errBox.classList.remove('visible');

  try {
    const res = await fetch(SCHEDULER_URL + '/apply', { method: 'POST' });
    const data = await res.json();

    if (data.status === 'ready') {
      // 已经在运行
      showReady(data.url, msg, spinner, linkBox, gotoLink);
    } else if (data.status === 'deploying') {
      // 开始轮询
      msg.textContent = data.message || '知识库正在准备中，预计 1-2 分钟...';
      pollTimer = setInterval(() => pollStatus(msg, spinner, linkBox, gotoLink, errBox), 5000);
    } else {
      throw new Error(data.message || '未知错误');
    }
  } catch (err) {
    spinner.style.display = 'none';
    msg.textContent = '申请失败';
    errBox.textContent = err.message;
    errBox.classList.add('visible');
    btn.disabled = false;
    btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg> 重新申请';
  }
}

async function pollStatus(msgEl, spinner, linkBox, gotoLink, errBox) {
  try {
    const res = await fetch(SCHEDULER_URL + '/status');
    const data = await res.json();

    if (data.status === 'ready' && data.url) {
      clearInterval(pollTimer);
      showReady(data.url, msgEl, spinner, linkBox, gotoLink);
    } else if (data.status === 'error') {
      clearInterval(pollTimer);
      spinner.style.display = 'none';
      msgEl.textContent = '部署失败';
      errBox.textContent = data.message || '未知错误';
      errBox.classList.add('visible');
      resetBtn();
    } else {
      // 更新状态消息
      msgEl.textContent = data.message || '准备中...';
    }
  } catch (err) {
    // 网络错误，继续轮询
  }
}

function showReady(url, msgEl, spinner, linkBox, gotoLink) {
  spinner.style.display = 'none';
  msgEl.textContent = '✅ 知识库已就绪！';
  gotoLink.href = url;
  linkBox.classList.add('visible');

  // 恢复按钮
  const btn = document.getElementById('applyBtn');
  btn.disabled = false;
  btn.className = 'btn success';
  btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg> 进入知识库';
  btn.onclick = function() { window.open(url, '_blank'); };
}

function resetBtn() {
  const btn = document.getElementById('applyBtn');
  btn.disabled = false;
  btn.className = 'btn';
  btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg> 重新申请';
  btn.onclick = apply;
}
</script>

</body>
</html>
