<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>实验室知识库 · 申请访问</title>
<style>
  :root {
    --bg: #f5f7fb;
    --card-bg: #ffffff;
    --text: #2c3e50;
    --sub: #6b7b8d;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --border: #e5e7eb;
    --shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 16px rgba(0,0,0,.04);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: var(--card-bg);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 48px 40px;
    max-width: 480px;
    width: 100%;
    text-align: center;
    transition: all .3s;
  }
  .icon {
    width: 64px;
    height: 64px;
    margin: 0 auto 24px;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    color: #fff;
  }
  h1 { font-size: 22px; color: var(--text); margin-bottom: 8px; font-weight: 600; }
  .desc { color: var(--sub); font-size: 14px; line-height: 1.6; margin-bottom: 32px; }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 14px 36px;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    transition: all .2s;
    text-decoration: none;
  }
  .btn:hover { background: var(--accent-hover); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(59,130,246,.3); }
  .btn:disabled { background: #93c5fd; cursor: not-allowed; transform: none; box-shadow: none; }

  .status-area { display: none; margin-top: 24px; }
  .status-area.visible { display: block; }

  .spinner {
    display: inline-block;
    width: 28px;
    height: 28px;
    border: 3px solid #e5e7eb;
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .8s linear infinite;
    margin-bottom: 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .status-msg { color: var(--sub); font-size: 14px; }

  .error-box {
    display: none;
    margin-top: 16px;
    padding: 14px;
    background: #fef2f2;
    border: 1px solid #fecaca;
    border-radius: 10px;
    font-size: 13px;
    color: #991b1b;
  }
  .error-box.visible { display: block; }

  .info-row {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin-top: 32px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    color: var(--sub);
    font-size: 12px;
  }
  .info-row span { display: flex; align-items: center; gap: 4px; }
</style>
</head>
<body>

<div class="card">
  <div class="icon">📚</div>
  <h1>实验室知识库</h1>
  <p class="desc">点一下，自动启动 · 用完自动回收</p>

  <button id="applyBtn" class="btn" onclick="apply()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
    申请访问
  </button>

  <div id="statusArea" class="status-area">
    <div id="spinnerEl" class="spinner"></div>
    <p id="statusMsg" class="status-msg"></p>
    <div id="errorBox" class="error-box"></div>
  </div>

  <div class="info-row">
    <span>⏱ 首次启动约 1-2 分钟</span>
    <span>🔄 5 分钟闲置自动回收</span>
  </div>
</div>

<script>
// ========== 配置 ==========
const SCHEDULER_URL = 'https://eclipsing-star-ff29.192529443.workers.dev';

// ========== 逻辑 ==========
let pollTimer = null;

function apply() {
  var btn = document.getElementById('applyBtn');
  var area = document.getElementById('statusArea');
  var msg = document.getElementById('statusMsg');
  var spinner = document.getElementById('spinnerEl');
  var errBox = document.getElementById('errorBox');

  btn.disabled = true;
  btn.textContent = '正在申请...';
  area.classList.add('visible');
  spinner.style.display = 'inline-block';
  msg.textContent = '正在启动知识库...';
  errBox.classList.remove('visible');

  fetch(SCHEDULER_URL + '/apply', { method: 'POST' })
    .then(function(res) { return res.json(); })
    .then(function(data) {
      if (data.status === 'ready') {
        // 已有在线服务，直接跳转
        msg.textContent = '知识库已在线，正在跳转...';
        window.location.href = data.url;
      } else if (data.status === 'deploying') {
        msg.textContent = data.message || '正在准备中，请稍候...';
        pollTimer = setInterval(pollStatus, 5000);
      } else {
        throw new Error(data.message || '未知错误');
      }
    })
    .catch(function(err) {
      clearInterval(pollTimer);
      spinner.style.display = 'none';
      msg.textContent = '启动失败，请重试';
      errBox.textContent = err.message;
      errBox.classList.add('visible');
      resetBtn();
    });
}

function pollStatus() {
  fetch(SCHEDULER_URL + '/status')
    .then(function(res) { return res.json(); })
    .then(function(data) {
      if (data.status === 'ready' && data.url) {
        clearInterval(pollTimer);
        document.getElementById('statusMsg').textContent = '准备完成，正在跳转...';
        window.location.href = data.url;
      } else if (data.status === 'error') {
        clearInterval(pollTimer);
        document.getElementById('spinnerEl').style.display = 'none';
        document.getElementById('statusMsg').textContent = '启动失败，请重试';
        var errBox = document.getElementById('errorBox');
        errBox.textContent = data.message || '未知错误';
        errBox.classList.add('visible');
        resetBtn();
      } else {
        document.getElementById('statusMsg').textContent = data.message || '准备中...';
      }
    });
}

function resetBtn() {
  var btn = document.getElementById('applyBtn');
  btn.disabled = false;
  btn.className = 'btn';
  btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg> 重新申请';
  btn.onclick = apply;
}
</script>

</body>
</html>
