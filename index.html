<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>实验室知识库</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- 顶部栏 -->
<header class="topbar">
  <div class="topbar-left">
    <button id="menuToggle" class="icon-btn" title="展开/收起目录">☰</button>
    <span class="site-title" id="siteTitle">实验室知识库</span>
  </div>
  <div class="topbar-center">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="搜索文章..." />
      <div id="searchResults" class="search-results hidden"></div>
    </div>
  </div>
  <div class="topbar-right">
    <button id="btnNewArticle" class="btn btn-primary hidden" title="新建文章">＋ 新建</button>
    <button id="btnManageCat" class="btn btn-ghost hidden" title="管理分类">☷ 分类</button>
    <button id="btnSettings" class="btn btn-ghost hidden" title="设置">⚙ 设置</button>
    <button id="btnLogin" class="btn btn-ghost">登录</button>
    <button id="btnLogout" class="btn btn-ghost hidden">退出</button>
  </div>
</header>

<!-- 主体 -->
<div class="main-container">
  <!-- 左侧目录 -->
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <span>目录</span>
    </div>
    <div id="treeView" class="tree-view"></div>
  </aside>

  <!-- 主内容区 -->
  <main id="contentArea" class="content-area">
    <div id="welcomeView" class="welcome-view">
      <h1 id="welcomeTitle">欢迎访问实验室知识库</h1>
      <p>请从左侧目录选择文章，或使用顶部搜索框查找内容。</p>
      <div id="recentList" class="recent-list"></div>
    </div>
    <div id="articleView" class="article-view hidden">
      <div id="articleBreadcrumb" class="breadcrumb"></div>
      <div id="articleActions" class="article-actions hidden">
        <button id="btnEditArticle" class="btn btn-sm">编辑</button>
        <button id="btnDeleteArticle" class="btn btn-sm btn-danger">删除</button>
      </div>
      <h1 id="articleTitle"></h1>
      <div id="articleMeta" class="article-meta"></div>
      <div id="articleBody" class="article-body markdown-body"></div>
    </div>

    <!-- 全屏文章编辑器 -->
    <div id="editorView" class="editor-view hidden">
      <div class="editor-topbar">
        <div class="editor-topbar-left">
          <button class="editor-back-btn" onclick="closeEditor()" title="返回">← 返回</button>
        </div>
        <div class="editor-topbar-center">
          <span class="editor-status" id="editorStatus">草稿已保存</span>
        </div>
        <div class="editor-topbar-right">
          <button class="btn btn-ghost btn-sm" onclick="previewArticle()">预览</button>
          <button class="btn btn-primary" id="btnPublish" onclick="saveArticle()">发布</button>
        </div>
      </div>
      <div class="editor-body">
        <div class="editor-container">
          <input type="text" id="artTitle" class="editor-title-input" placeholder="请输入文章标题..." />
          <div class="editor-toolbar">
            <button class="toolbar-btn" data-cmd="bold" title="加粗 (Ctrl+B)"><b>B</b></button>
            <button class="toolbar-btn" data-cmd="italic" title="斜体 (Ctrl+I)"><i>I</i></button>
            <button class="toolbar-btn" data-cmd="strike" title="删除线">S</button>
            <span class="toolbar-divider"></span>
            <button class="toolbar-btn" data-cmd="h1" title="一级标题">H1</button>
            <button class="toolbar-btn" data-cmd="h2" title="二级标题">H2</button>
            <button class="toolbar-btn" data-cmd="h3" title="三级标题">H3</button>
            <span class="toolbar-divider"></span>
            <button class="toolbar-btn" data-cmd="ul" title="无序列表">•</button>
            <button class="toolbar-btn" data-cmd="ol" title="有序列表">1.</button>
            <button class="toolbar-btn" data-cmd="quote" title="引用">"</button>
            <span class="toolbar-divider"></span>
            <button class="toolbar-btn" data-cmd="code" title="行内代码">{'<>'}</button>
            <button class="toolbar-btn" data-cmd="codeblock" title="代码块">{ }</button>
            <button class="toolbar-btn" data-cmd="link" title="链接">🔗</button>
            <button class="toolbar-btn" data-cmd="image" title="图片">🖼</button>
            <span class="toolbar-divider"></span>
            <button class="toolbar-btn" data-cmd="hr" title="分割线">—</button>
            <button class="toolbar-btn" data-cmd="table" title="表格">▦</button>
          </div>
          <div class="editor-meta-row">
            <div class="form-group" style="margin-bottom:0">
              <select id="artCategory" class="form-input" style="width:200px">
                <option value="">-- 选择分类 --</option>
              </select>
            </div>
            <div class="form-group" style="margin-bottom:0;margin-left:12px;flex:1">
              <input type="text" id="artSummary" class="form-input" placeholder="文章摘要（选填，用于搜索展示）" />
            </div>
          </div>
          <div class="editor-tabs">
            <button class="editor-tab active" id="tabWrite" onclick="switchEditorTab('write')">写文章</button>
            <button class="editor-tab" id="tabPreview" onclick="switchEditorTab('preview')">预览</button>
          </div>
          <div id="editorWrite" class="editor-write">
            <textarea id="artContent" class="editor-textarea" placeholder="在这里输入文章内容，支持 Markdown 格式...&#10;&#10;快捷工具栏按钮可帮助你快速插入格式。&#10;支持 Markdown 语法：&#10;# 标题&#10;**加粗** *斜体*&#10;- 列表项&#10;> 引用&#10;`代码` ```代码块```&#10;[链接](url) ![图片](url)"></textarea>
          </div>
          <div id="editorPreview" class="editor-preview hidden"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- 登录弹窗 -->
<div id="loginModal" class="modal hidden">
  <div class="modal-backdrop"></div>
  <div class="modal-dialog">
    <div class="modal-header">
      <h3>管理员登录</h3>
      <button class="modal-close" onclick="closeModal('loginModal')">×</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>用户名</label>
        <input type="text" id="loginUser" class="form-input" placeholder="admin" />
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="loginPass" class="form-input" placeholder="密码" />
      </div>
      <p id="loginError" class="form-error hidden"></p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('loginModal')">取消</button>
      <button class="btn btn-primary" onclick="doLogin()">登录</button>
    </div>
  </div>
</div>


<!-- 管理分类弹窗 -->
<div id="catModal" class="modal hidden">
  <div class="modal-backdrop"></div>
  <div class="modal-dialog">
    <div class="modal-header">
      <h3>管理分类</h3>
      <button class="modal-close" onclick="closeModal('catModal')">×</button>
    </div>
    <div class="modal-body">
      <div id="catList" class="cat-list"></div>
      <hr/>
      <div class="form-group">
        <label>新建一级分类</label>
        <div class="form-row">
          <input type="text" id="newCatName" class="form-input flex-1" placeholder="分类名称" />
          <button class="btn btn-primary" onclick="addCategory()">添加</button>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('catModal')">关闭</button>
    </div>
  </div>
</div>

<!-- 设置弹窗 -->
<div id="settingsModal" class="modal hidden">
  <div class="modal-backdrop"></div>
  <div class="modal-dialog">
    <div class="modal-header">
      <h3>网站设置</h3>
      <button class="modal-close" onclick="closeModal('settingsModal')">×</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>网站名称</label>
        <input type="text" id="setSiteName" class="form-input" />
      </div>
      <div class="form-group">
        <label>管理员用户名</label>
        <input type="text" id="setAdminUser" class="form-input" />
      </div>
      <div class="form-group">
        <label>新密码（留空表示不修改）</label>
        <input type="password" id="setAdminPass" class="form-input" placeholder="输入新密码" />
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('settingsModal')">取消</button>
      <button class="btn btn-primary" onclick="saveSettings()">保存</button>
    </div>
  </div>
</div>

<!-- 删除确认弹窗 -->
<div id="confirmModal" class="modal hidden">
  <div class="modal-backdrop"></div>
  <div class="modal-dialog modal-sm">
    <div class="modal-header">
      <h3>确认删除</h3>
      <button class="modal-close" onclick="closeModal('confirmModal')">×</button>
    </div>
    <div class="modal-body">
      <p id="confirmMsg">确定要删除吗？此操作不可恢复。</p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('confirmModal')">取消</button>
      <button class="btn btn-danger" id="confirmOk">确定删除</button>
    </div>
  </div>
</div>

<script src="/app.js"></script>

</body>
</html>
